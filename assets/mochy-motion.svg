<svg xmlns="http://www.w3.org/2000/svg" width="840" height="165" viewBox="0 0 840 165" role="img"><title>mochy</title><style>text{font-family:Arial,sans-serif}.bob{animation:bob 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.pulse{animation:pulse 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.slide{animation:slide 9s ease-in-out infinite}.spark{animation:twinkle 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.spark2{animation:twinkle 7s ease-in-out infinite;animation-delay:-2s;transform-box:fill-box;transform-origin:center}.glow{animation:glow 6s ease-in-out infinite}.drift{animation:drift 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes pulse{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.035)}}@keyframes twinkle{0%,100%{opacity:.48;transform:scale(.94)}50%{opacity:.9;transform:scale(1.04)}}@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(12px)}}@keyframes glow{0%,100%{opacity:.25}50%{opacity:.7}}@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 18s linear infinite}.sway{transform-box:fill-box;transform-origin:center;animation:sway 7s ease-in-out infinite}.bar{transform-box:fill-box;transform-origin:center bottom;animation:bar 4s ease-in-out infinite}.bar2{animation-delay:-1.4s}.bar3{animation-delay:-2.7s}.dash{animation:dash 8s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes bar{0%,100%{transform:scaleY(.55);opacity:.45}50%{transform:scaleY(1);opacity:.85}}@keyframes dash{0%,100%{stroke-dashoffset:0;opacity:.35}50%{stroke-dashoffset:40;opacity:.8}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0" y="0" width="840" height="165" rx="30" fill="#21191d"/><circle cx="44" cy="44" r="20" fill="#743f55" class="pulse"/><text class="sway" x="44" y="51" text-anchor="middle" font-size="22" fill="#ffe1ed">♫</text><text x="30" y="102" font-size="25" fill="#fff4f8" font-weight="bold">Mochy Music — Xbibz</text><text x="30" y="129" font-size="15" fill="#cdbbc3">Pemutar musik Android yang modern.</text><text x="30" y="150" font-size="15" fill="#cdbbc3">Fork dengan pengembangan tambahan.</text><text x="772" y="40" font-size="21" fill="#e99abb" class="spark2">✦</text><rect x="30" y="70" width="78" height="2" rx="1" fill="#e99abb" class="glow"/><circle cx="740" cy="40" r="3" fill="#e99abb" class="spark"/></svg>