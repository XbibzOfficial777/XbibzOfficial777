<svg xmlns="http://www.w3.org/2000/svg" width="840" height="180" viewBox="0 0 840 180" role="img"><title>stack</title><style>text{font-family:Arial,sans-serif}.bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.slide{animation:slide 6s ease-in-out infinite}.spark{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.spark2{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes pulse{0%,100%{opacity:.5;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(20px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0" y="0" width="840" height="180" rx="30" fill="#21191d"/><circle cx="45" cy="46" r="18" fill="#6f3b50" class="pulse"/><text x="38" y="52" font-size="17" fill="#ffcee1">✦</text><text x="76" y="54" font-size="23" font-weight="bold" fill="#fff1f6">Tech stack</text><text x="35" y="91" font-size="13" fill="#b99daa">LANGUAGES &amp; FRAMEWORKS</text><rect x="30" y="104" width="780" height="43" rx="13" fill="#34272e"/><text x="47" y="132" font-size="17" fill="#f1d3df">Python  ·  JavaScript  ·  TypeScript  ·  Kotlin  ·  Dart  ·  Flutter</text><text x="772" y="54" font-size="22" fill="#e99abb" class="spark">✧</text></svg>