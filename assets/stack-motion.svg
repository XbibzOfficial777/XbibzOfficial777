<svg xmlns="http://www.w3.org/2000/svg" width="840" height="180" viewBox="0 0 840 180" role="img"><title>stack</title><style>text{font-family:Arial,sans-serif}.bob{animation:bob 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.pulse{animation:pulse 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.slide{animation:slide 9s ease-in-out infinite}.spark{animation:twinkle 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.spark2{animation:twinkle 7s ease-in-out infinite;animation-delay:-2s;transform-box:fill-box;transform-origin:center}.glow{animation:glow 6s ease-in-out infinite}.drift{animation:drift 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes pulse{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.035)}}@keyframes twinkle{0%,100%{opacity:.48;transform:scale(.94)}50%{opacity:.9;transform:scale(1.04)}}@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(12px)}}@keyframes glow{0%,100%{opacity:.25}50%{opacity:.7}}@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 18s linear infinite}.sway{transform-box:fill-box;transform-origin:center;animation:sway 7s ease-in-out infinite}.bar{transform-box:fill-box;transform-origin:center bottom;animation:bar 4s ease-in-out infinite}.bar2{animation-delay:-1.4s}.bar3{animation-delay:-2.7s}.dash{animation:dash 8s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes bar{0%,100%{transform:scaleY(.55);opacity:.45}50%{transform:scaleY(1);opacity:.85}}@keyframes dash{0%,100%{stroke-dashoffset:0;opacity:.35}50%{stroke-dashoffset:40;opacity:.8}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0" y="0" width="840" height="180" rx="30" fill="#21191d"/><circle cx="45" cy="46" r="18" fill="#6f3b50" class="pulse"/><text x="38" y="52" font-size="17" fill="#ffcee1">✦</text><text x="76" y="54" font-size="23" font-weight="bold" fill="#fff1f6">Tech stack</text><text x="35" y="91" font-size="13" fill="#b99daa">LANGUAGES &amp; FRAMEWORKS</text><rect x="30" y="104" width="780" height="43" rx="13" fill="#34272e"/><text x="47" y="132" font-size="17" fill="#f1d3df">Python  ·  JavaScript  ·  TypeScript  ·  Kotlin  ·  Dart  ·  Flutter</text><text x="772" y="54" font-size="22" fill="#e99abb" class="spark">✧</text><circle cx="790" cy="48" r="3" fill="#e99abb" class="spark2"/><g fill="#e99abb"><rect x="753" y="69" width="4" height="17" rx="2" class="bar"/><rect x="763" y="65" width="4" height="21" rx="2" class="bar bar2"/><rect x="773" y="72" width="4" height="14" rx="2" class="bar bar3"/></g></svg>