<svg xmlns="http://www.w3.org/2000/svg" width="840" height="165" viewBox="0 0 840 165" role="img"><title>evillimiter</title><style>text{font-family:Arial,sans-serif}.bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.slide{animation:slide 6s ease-in-out infinite}.spark{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.spark2{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes pulse{0%,100%{opacity:.5;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(20px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0" y="0" width="840" height="165" rx="30" fill="#21191d"/><circle cx="44" cy="44" r="20" fill="#743f55" class="pulse"/><text x="44" y="51" text-anchor="middle" font-size="22" fill="#ffe1ed">⌁</text><text x="30" y="102" font-size="25" fill="#fff4f8" font-weight="bold">Evillimiter</text><text x="30" y="129" font-size="15" fill="#cdbbc3">Monitor dan analisis bandwidth.</text><text x="30" y="150" font-size="15" fill="#cdbbc3">Tool Python untuk jaringan lokal.</text><text x="772" y="40" font-size="21" fill="#e99abb" class="spark2">✦</text></svg>