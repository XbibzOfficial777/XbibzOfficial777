<svg xmlns="http://www.w3.org/2000/svg" width="840" height="45" viewBox="0 0 840 45" role="img"><title>wave</title><style>text{font-family:Arial,sans-serif}.bob{animation:bob 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.pulse{animation:pulse 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.slide{animation:slide 9s ease-in-out infinite}.spark{animation:twinkle 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.spark2{animation:twinkle 7s ease-in-out infinite;animation-delay:-2s;transform-box:fill-box;transform-origin:center}.glow{animation:glow 6s ease-in-out infinite}.drift{animation:drift 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes pulse{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.035)}}@keyframes twinkle{0%,100%{opacity:.48;transform:scale(.94)}50%{opacity:.9;transform:scale(1.04)}}@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(12px)}}@keyframes glow{0%,100%{opacity:.25}50%{opacity:.7}}@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0" y="0" width="840" height="45" rx="30" fill="#21191d"/><path d="M-50 22 Q-38 6 -26 22 T-2 22 T22 22 T46 22 T70 22 T94 22 T118 22 T142 22 T166 22 T190 22 T214 22 T238 22 T262 22 T286 22 T310 22 T334 22 T358 22 T382 22 T406 22 T430 22 T454 22 T478 22 T502 22 T526 22 T550 22 T574 22 T598 22 T622 22 T646 22 T670 22 T694 22 T718 22 T742 22 T766 22 T790 22 T814 22 T838 22 T862 22" fill="none" stroke="#e99abb" stroke-width="4" class="slide"/></svg>