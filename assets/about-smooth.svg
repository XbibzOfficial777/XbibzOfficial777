<svg xmlns="http://www.w3.org/2000/svg" width="840" height="210" viewBox="0 0 840 210" role="img"><title>about</title><style>text{font-family:Arial,sans-serif}.bob{animation:bob 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.pulse{animation:pulse 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.slide{animation:slide 9s ease-in-out infinite}.spark{animation:twinkle 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.spark2{animation:twinkle 7s ease-in-out infinite;animation-delay:-2s;transform-box:fill-box;transform-origin:center}.glow{animation:glow 6s ease-in-out infinite}.drift{animation:drift 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes pulse{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.035)}}@keyframes twinkle{0%,100%{opacity:.48;transform:scale(.94)}50%{opacity:.9;transform:scale(1.04)}}@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(12px)}}@keyframes glow{0%,100%{opacity:.25}50%{opacity:.7}}@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0" y="0" width="840" height="210" rx="30" fill="#21191d"/><circle cx="45" cy="46" r="18" fill="#6f3b50" class="pulse"/><text x="37" y="53" font-size="18" fill="#ffcee1">♥</text><text x="76" y="54" font-size="23" font-weight="bold" fill="#fff1f6">About me</text><rect x="28" y="77" width="784" height="32" rx="11" fill="#34272e"/><text x="47" y="99" font-size="16" fill="#eadde3">✦ Developer dari Indonesia · membangun website, aplikasi &amp; CLI</text><rect x="28" y="116" width="784" height="32" rx="11" fill="#34272e"/><text x="47" y="138" font-size="16" fill="#eadde3">✦ Menjelajahi AI, otomasi, dan proyek open source</text><rect x="28" y="155" width="784" height="32" rx="11" fill="#34272e"/><text x="47" y="177" font-size="16" fill="#eadde3">✦ Terbuka untuk kolaborasi dan pembuatan website</text><circle cx="790" cy="48" r="3" fill="#e99abb" class="spark2"/></svg>