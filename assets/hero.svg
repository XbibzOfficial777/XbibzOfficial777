<svg xmlns="http://www.w3.org/2000/svg" width="840" height="260" viewBox="0 0 840 260" role="img"><title>hero</title><style>text{font-family:Arial,sans-serif}.bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.slide{animation:slide 6s ease-in-out infinite}.spark{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.spark2{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes pulse{0%,100%{opacity:.5;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(20px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0" y="0" width="840" height="260" rx="30" fill="#21191d"/><circle cx="754" cy="35" r="100" fill="#9f5074" opacity=".23" class="pulse"/><circle cx="95" cy="130" r="65" fill="#6f3b50" class="bob"/><circle cx="95" cy="130" r="51" fill="#e99abb" opacity=".3"/><text x="95" y="144" text-anchor="middle" font-size="43" fill="#f8d7e4" font-weight="bold" class="bob">X</text><text x="190" y="78" font-size="18" fill="#e9b5ca">HALO, SAYA</text><text x="190" y="133" font-size="43" fill="#fff3f7" font-weight="bold">Xbibz Official</text><text x="190" y="169" font-size="19" fill="#dac9d0">Developer · Technology · Creativity</text><rect x="190" y="190" width="263" height="34" rx="17" fill="#513341"/><text x="208" y="213" font-size="15" fill="#f1cadb">Reading code at night ✦</text><text x="733" y="158" font-size="40" fill="#e99abb" class="spark">✦</text><text x="675" y="209" font-size="24" fill="#e99abb" class="spark2">✧</text></svg>